  <rect x="710" y="720" width="160" height="18" rx="3" fill="#dc2626" opacity="0.85"/>
  <text x="715" y="733" font-size="10" fill="white">Búsqueda predictiva (3h)</text>
  
  <rect x="710" y="742" width="160" height="18" rx="3" fill="#dc2626" opacity="0.85"/>
  <text x="715" y="755" font-size="10" fill="white">Venta express (3h)</text>
  
  <!-- Milestone 4 -->
  <polygon points="875,751 885,756 875,761 865,756" fill="#dc2626"/>
  <text x="890" y="760" font-size="9" fill="#dc2626" font-weight="bold">Motor estabilizado</text>

  <!-- ============ FASE V ============ -->
  <text x="10" y="770" font-size="12" font-weight="bold" fill="#7c3aed">FASE V</text>
  <text x="10" y="784" font-size="10" fill="#64748b">Validación</text>
  
  <rect x="890" y="758" width="180" height="18" rx="3" fill="#7c3aed" opacity="0.85"/>
  <text x="895" y="771" font-size="10" fill="white">Pruebas concurrencia (3h)</text>
  
  <rect x="890" y="780" width="180" height="18" rx="3" fill="#7c3aed" opacity="0.85"/>
  <text x="895" y="793" font-size="10" fill="white">Despliegue Vercel (2h)</text>
  
  <rect x="890" y="802" width="180" height="18" rx="3" fill="#7c3aed" opacity="0.85"/>
  <text x="895" y="815" font-size="10" fill="white">Capacitación y cierre (3h)</text>
  
  <!-- Milestone 5 -->
  <polygon points="1075,811 1085,816 1075,821 1065,816" fill="#7c3aed"/>
  <text x="1090" y="820" font-size="9" fill="#7c3aed" font-weight="bold">Sistema implantado</text>

  <!-- Legend -->
  <rect x="170" y="690" width="12" height="12" rx="2" fill="#2563eb" opacity="0.85"/>
  <text x="186" y="700" font-size="10" fill="#475569">Fase I: Diagnóstico</text>
  <rect x="310" y="690" width="12" height="12" rx="2" fill="#059669" opacity="0.85"/>
  <text x="326" y="700" font-size="10" fill="#475569">Fase II: Modelado</text>
  <rect x="450" y="690" width="12" height="12" rx="2" fill="#d97706" opacity="0.85"/>
  <text x="466" y="700" font-size="10" fill="#475569">Fase III: Inventario</text>
  <rect x="600" y="690" width="12" height="12" rx="2" fill="#dc2626" opacity="0.85"/>
  <text x="616" y="700" font-size="10" fill="#475569">Fase IV: Mostrador</text>
  <rect x="750" y="690" width="12" height="12" rx="2" fill="#7c3aed" opacity="0.85"/>
  <text x="766" y="700" font-size="10" fill="#475569">Fase V: Validación</text>
  <polygon points="910,690 918,694 910,698 902,694" fill="#475569"/>
  <text x="924" y="700" font-size="10" fill="#475569">Hito de validación</text>
</svg>
