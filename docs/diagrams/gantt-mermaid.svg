  <rect x="530" y="542" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="555" font-size="10" fill="white">Actualización precios (2h)</text>
  
  <rect x="530" y="564" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="577" font-size="10" fill="white">Recepción mercancía (4h)</text>
  
  <rect x="530" y="586" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="599" font-size="10" fill="white">Validaciones server (3h)</text>
  
  <rect x="530" y="608" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="621" font-size="10" fill="white">Numérico fraccionado (1h)</text>
  
  <rect x="530" y="630" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="643" font-size="10" fill="white">Simulación datos (2h)</text>
  
  <rect x="530" y="652" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
  <text x="535" y="665" font-size="10" fill="white">Documentación técnica (2h)</text>
  
  <!-- Milestone 3 -->
  <polygon points="695,661 705,666 695,671 685,666" fill="#d97706"/>
  <text x="710" y="670" font-size="9" fill="#d97706" font-weight="bold">Inventario operativo</text>

  <!-- ============ FASE IV ============ -->
  <text x="10" y="710" font-size="12" font-weight="bold" fill="#dc2626">FASE IV</text>
  <text x="10" y="724" font-size="10" fill="#64748b">Mostrador</text>
  
  <rect x="710" y="698" width="160" height="18" rx="3" fill="#dc2626" opacity="0.85"/>
