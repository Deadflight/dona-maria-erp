  <rect x="350" y="386" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="399" font-size="10" fill="white">Entorno cloud Supabase (4h)</text>
  
  <rect x="350" y="408" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="421" font-size="10" fill="white">Inicializar Next.js (2h)</text>
  
  <rect x="350" y="430" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="443" font-size="10" fill="white">Setup Tailwind/shadcn (2h)</text>
  
  <rect x="350" y="452" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="465" font-size="10" fill="white">Pruebas Server Actions (6h)</text>
  
  <!-- Milestone 2 -->
  <polygon points="515,461 525,466 515,471 505,466" fill="#059669"/>
  <text x="530" y="470" font-size="9" fill="#059669" font-weight="bold">Arquitectura aprobada</text>

