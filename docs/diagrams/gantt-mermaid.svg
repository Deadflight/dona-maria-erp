<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="1120" height="720" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="560" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Figura 3.2: Diagrama de Gantt del Proyecto</text>
  <text x="560" y="52" text-anchor="middle" font-size="11" fill="#64748b">Ferretería "El Imperio Doña María" — 40 días hábiles (120 horas) | Elaboración propia (2026)</text>
  
  <!-- Timeline header -->
  <line x1="160" y1="65" x2="1090" y2="65" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Week labels -->
  <text x="250" y="80" text-anchor="middle" font-size="10" fill="#64748b">Sem 1-2</text>
  <text x="430" y="80" text-anchor="middle" font-size="10" fill="#64748b">Sem 3-4</text>
  <text x="610" y="80" text-anchor="middle" font-size="10" fill="#64748b">Sem 5-6</text>
  <text x="790" y="80" text-anchor="middle" font-size="10" fill="#64748b">Sem 7-8</text>
  <text x="970" y="80" text-anchor="middle" font-size="10" fill="#64748b">Sem 8-9</text>
  
  <!-- Phase separators -->
  <line x1="340" y1="65" x2="340" y2="700" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="520" y1="65" x2="520" y2="700" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="700" y1="65" x2="700" y2="700" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="880" y1="65" x2="880" y2="700" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>

  <!-- ============ FASE I ============ -->
  <text x="10" y="110" font-size="12" font-weight="bold" fill="#2563eb">FASE I</text>
  <text x="10" y="124" font-size="10" fill="#64748b">Diagnóstico</text>
  
  <rect x="170" y="98" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="111" font-size="10" fill="white">Auditoría procesos (2h)</text>
  
  <rect x="170" y="120" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="133" font-size="10" fill="white">Mapeo comunicación (1h)</text>
  
  <rect x="170" y="142" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="155" font-size="10" fill="white">Auditoría conciliación (2h)</text>
  
  <rect x="170" y="164" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="177" font-size="10" fill="white">Pérdidas desabast. (1h)</text>
  
  <rect x="170" y="186" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="199" font-size="10" fill="white">Reglas negocio (3h)</text>
  
  <rect x="170" y="208" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="221" font-size="10" fill="white">Formalizar diagnóstico (3h)</text>
  
  <rect x="170" y="230" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="243" font-size="10" fill="white">Objetivos y alcance (2h)</text>
  
  <rect x="170" y="252" width="160" height="18" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="175" y="265" font-size="10" fill="white">Factibilidad integral (2h)</text>
  
  <!-- Milestone 1 -->
  <polygon points="335,261 345,266 335,271 325,266" fill="#2563eb"/>
  <text x="350" y="270" font-size="9" fill="#2563eb" font-weight="bold">Diagnóstico validado</text>

