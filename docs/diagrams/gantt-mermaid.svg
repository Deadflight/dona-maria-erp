  <rect x="350" y="320" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="333" font-size="10" fill="white">Modelado datos (2h)</text>
  
  <rect x="350" y="342" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
  <text x="355" y="355" font-size="10" fill="white">Relacional financiero (4h)</text>
  
  <rect x="350" y="364" width="160" height="18" rx="3" fill="#059669" opacity="0.85"/>
