  <text x="10" y="510" font-size="12" font-weight="bold" fill="#d97706">FASE III</text>
  <text x="10" y="524" font-size="10" fill="#64748b">Inventario</text>
  
  <rect x="530" y="498" width="160" height="18" rx="3" fill="#d97706" opacity="0.85"/>
